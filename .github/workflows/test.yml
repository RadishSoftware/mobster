name: test

# Maintainers run these checks in parallel on their own Macs, in about half a minute. macOS
# runners bill at ten times Linux minutes, so this workflow runs only when started by hand.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  backend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r mobile_agent/requirements.txt
      - run: make test-backend PYTHON=python3
        env:
          MOBSTER_TEST_TIME_SCALE: "2.5"  # shared runners: timing bounds back up structural checks
