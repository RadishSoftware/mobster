name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r mobile_agent/requirements.txt
      - run: make test-backend PYTHON=python3
        env:
          MOBSTER_TEST_TIME_SCALE: "2.5"  # shared runners: timing bounds back up structural checks
