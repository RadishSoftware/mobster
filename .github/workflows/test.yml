name: test

# Run the full standalone suite on a hosted Mac when local capacity is unavailable.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  backend:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r mobile_agent/requirements.txt -r mobile_agent/requirements-dev.txt
      - run: make test-backend PYTHON=python3 TEST_JOBS=2
        env:
          MOBSTER_TEST_TIME_SCALE: "2.5"  # shared runners: timing bounds back up structural checks
