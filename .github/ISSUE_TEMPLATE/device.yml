name: Device problem or report
description: Your iPhone isn't detected or setup stops, or you want to tell us how Mobster works on your model.
labels: [device-report, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Mobster is measured on one iPhone model. Reports from other phones, iOS versions and apps show where it works and where it doesn't. Leave out UDIDs, team IDs, keys and screenshots of private screens.
  - type: dropdown
    id: outcome
    attributes:
      label: What happened
      options: [It works, It works after changes, Setup stops, Mobster doesn't see the phone, Taps or typing fail, Something else]
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: iPhone model and iOS version
      placeholder: iPhone 13 mini, iOS 26.1
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model, macOS and Xcode versions
      placeholder: MacBook Pro M3, macOS 26.1, Xcode 26.0
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options: [USB cable, Simulator]
  - type: dropdown
    id: step
    attributes:
      label: Where it stopped
      options: [It didn't stop, Developer Mode, Trust this computer, Signing and team, WebDriverAgent build, WebDriverAgent not reachable, Reading the screen, Tapping and typing, Locked phone, Not sure]
  - type: textarea
    id: doctor
    attributes:
      label: Output of `mobster --version`, `mobster doctor --json` and `mobster devices --json`
      render: text
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks you tried
      description: Each task, the app, and how it ended (the status Mobster showed).
      placeholder: |
        Turn on Dark Mode (Settings): Finished
        Text Alex "on my way" (Messages): Declined at Send, as expected
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Apps whose controls Mobster could not see, setup steps that needed changes, timings.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed UDIDs, team IDs and keys from the output above.
          required: true
