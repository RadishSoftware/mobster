# Mobster checks on every merge request, on a Mac of yours (https://docs.mobster.dev/ci/gitlab).
# Register the Mac as a runner with the shell executor and the tag "mobster". On it, `mobster ci doctor` says what's
# missing. For the MR comment, add MOBSTER_GITLAB_TOKEN (a project access token with the api scope) as a masked
# CI/CD variable. For checks with steps, add ANTHROPIC_API_KEY the same way.
mobster:
  stage: test
  tags: [mobster]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
    MOBSTER: /Applications/Mobster.app/Contents/MacOS/mobster-agent
  timeout: 1h
  interruptible: true
  script:
    - |
      "$MOBSTER" ci run
  after_script:
    - |
      "$MOBSTER" ci comment
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .mobster/ci/
    reports:
      junit: .mobster/ci/junit.xml
